name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests + coverage
        run: npm run coverage

      - name: Type-check (covers the test files the rollup gate can't see)
        run: npm run typecheck

      - name: Assert core stays UI-agnostic
        run: |
          if grep -rq "@elgato" packages/core/src; then
            echo "::error::packages/core imports @elgato — the core must not depend on the Stream Deck SDK."
            exit 1
          fi
        shell: bash

      - name: Build icons + bundle
        run: npm run build

      - name: Validate manifest
        run: npm run validate

      - name: Pack plugin
        if: matrix.os == 'macos-latest'
        run: npm run pack:force

      - name: Upload artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: siestadeck-plugin
          path: apps/streamdeck/io.github.aguilarguisado.siestadeck.streamDeckPlugin
          retention-days: 14
