name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Note: electron's postinstall pulls its ~100MB binary on both legs, even
      # though CI only bundles the menu bar app and never launches it. Electron
      # 44 has no supported opt-out — ELECTRON_SKIP_BINARY_DOWNLOAD went away
      # with the old electron-download installer, and @electron/get only exposes
      # mirror and cache-root controls. `cache: npm` above does not cover it
      # either: the binary lands in electron's own cache, not ~/.npm. If this
      # ever costs real minutes, cache `~/Library/Caches/electron` and
      # `%LOCALAPPDATA%\electron\Cache` explicitly.
      - run: npm ci

      - name: Tests + coverage
        run: npm run coverage

      - name: Type-check (rollup reports type errors as warnings and exits 0)
        run: npm run typecheck

      - name: Assert core stays UI-agnostic
        run: |
          if grep -rqE "@elgato|electron" packages/core/src; then
            echo "::error::packages/core references a host SDK — the core must not depend on @elgato/streamdeck or electron."
            exit 1
          fi
        shell: bash

      - name: Build icons + bundle
        run: npm run build

      - name: Validate manifest
        run: npm run validate

      # macOS-only: the menu bar app is a macOS product, and gating it here is
      # what keeps the Windows leg green.
      - name: Build menu bar app
        if: matrix.os == 'macos-latest'
        run: npm run build:desktop

      - name: Release readiness check
        if: matrix.os == 'macos-latest'
        run: npm run check:release

      - name: Pack plugin
        if: matrix.os == 'macos-latest'
        run: npm run pack:force

      - name: Upload artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: siestadeck-plugin
          path: apps/streamdeck/io.github.aguilarguisado.siestadeck.streamDeckPlugin
          retention-days: 14
